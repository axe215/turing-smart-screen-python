<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turing 9.2" — Theme Manager</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <div class="brand">
    <h1>Turing 9.2"</h1>
    <span class="meta">Theme Manager</span>
  </div>
  <div id="status">
    <span class="badge" id="status-running">…</span>
    <span id="status-theme">—</span>
    <span class="meta" id="status-meta"></span>
  </div>
  <button id="stop-btn" class="btn btn-danger" disabled>Stop</button>
</header>

<main>
  <section id="params">
    <h2>Параметры</h2>
    <p class="hint">Применяются при следующей активации темы. Активную тему перезапусти после изменения, чтобы значения попали в работу.</p>
    <div class="grid">
      <label class="row">
        <input type="checkbox" id="param-rotate-180">
        <span>Rotate overlay 180°</span>
      </label>
      <label class="col">
        <span>Rotate video</span>
        <select id="param-rotate-video">
          <option value="0">0°</option>
          <option value="90">90°</option>
          <option value="180">180°</option>
          <option value="270">270°</option>
        </select>
      </label>
      <label class="col">
        <span>Font scale: <strong id="param-font-scale-val">1.30</strong></span>
        <input type="range" id="param-font-scale" min="0.8" max="2.0" step="0.05">
      </label>
      <label class="col">
        <span>Widget period: <strong id="param-widget-period-val">1.0</strong> s</span>
        <input type="range" id="param-widget-period" min="0.5" max="5.0" step="0.1">
      </label>
    </div>
  </section>

  <section id="themes">
    <h2>Темы</h2>
    <p class="hint">Карточка с зелёной обводкой и значком ● ACTIVE — то, что сейчас идёт на экране.</p>
    <div id="theme-grid">Loading…</div>
  </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
