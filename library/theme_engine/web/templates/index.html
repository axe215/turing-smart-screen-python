<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turing 9.2" — Theme Manager</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
  <h1>Turing 9.2"</h1>
  <div id="status">
    <span class="badge" id="status-running">…</span>
    <span id="status-theme">—</span>
    <span class="meta" id="status-meta"></span>
  </div>
  <button id="stop-btn" class="btn btn-danger">Stop</button>
</header>

<main>
  <section id="params">
    <h2>Параметры</h2>
    <div class="grid">
      <label>
        <input type="checkbox" id="param-rotate-180">
        Rotate overlay 180°
      </label>
      <label>
        Rotate video
        <select id="param-rotate-video">
          <option value="0">0°</option>
          <option value="90">90°</option>
          <option value="180">180°</option>
          <option value="270">270°</option>
        </select>
      </label>
      <label>
        Font scale: <span id="param-font-scale-val">1.30</span>
        <input type="range" id="param-font-scale" min="0.8" max="2.0" step="0.05">
      </label>
      <label>
        Widget period: <span id="param-widget-period-val">1.0</span>s
        <input type="range" id="param-widget-period" min="0.5" max="5.0" step="0.1">
      </label>
    </div>
  </section>

  <section id="themes">
    <h2>Темы</h2>
    <div id="theme-grid">Loading…</div>
  </section>
</main>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
