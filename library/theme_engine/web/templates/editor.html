<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editor — {{ dir_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='editor.css') }}">
</head>
<body class="editor-body">
<header class="editor-header">
  <a class="brand" href="/">←</a>
  <div class="title">
    <h1 id="editor-title">{{ dir_name }}</h1>
    <span class="meta" id="editor-meta">loading…</span>
  </div>
  <div class="editor-actions">
    <button id="btn-preview" class="btn">Render preview</button>
    <button id="btn-save" class="btn btn-primary">Save</button>
  </div>
</header>

<main class="editor-main">
  <aside class="editor-left">
    <h2>Widgets</h2>
    <div class="add-widget-row">
      <select id="add-widget-type"></select>
      <button id="add-widget-btn" class="btn btn-primary">+ Add</button>
    </div>
    <p class="hint">Перетаскивай рамку мышкой на холсте. Свойства — в правой панели.</p>
    <ul id="widget-list" class="widget-list"></ul>
  </aside>

  <section class="editor-canvas-wrap">
    <div id="canvas-stage" class="canvas-stage">
      <!-- Background image (or solid colour for video themes) is the
           CSS background of #design-canvas; widget boxes are absolutely
           positioned children inside it. -->
      <div id="design-canvas" class="design-canvas"></div>
    </div>
    <p class="hint canvas-hint" id="canvas-hint"></p>
  </section>

  <aside class="editor-right">
    <h2>Selected widget</h2>
    <div id="properties-panel" class="properties-panel">
      <p class="muted">Выбери виджет в списке слева или на холсте.</p>
    </div>
  </aside>
</main>

<div id="preview-modal" class="preview-modal hidden">
  <div class="preview-modal-inner">
    <div class="preview-modal-bar">
      <span>Design preview (как пойдёт на экран после ротации)</span>
      <button id="preview-close" class="btn">Close</button>
    </div>
    <img id="preview-image" alt="design preview">
  </div>
</div>

<script>
window.EDITOR_DIR = {{ dir_name|tojson }};
</script>
<script src="{{ url_for('static', filename='editor.js') }}"></script>
</body>
</html>
